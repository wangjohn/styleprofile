name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: check (Python ${{ matrix.python-version }}, with spaCy)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra syntax
      - run: make test
      # Lint, format and type checks target the oldest supported Python (see pyproject.toml);
      # run them once, on that version.
      - if: matrix.python-version == '3.11'
        run: make lint typecheck
      - if: matrix.python-version == '3.11'
        run: make demo

  no-syntax:
    name: test (Python 3.11, without spaCy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - name: Confirm spaCy is absent
        run: uv run python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('spacy') is not None)"
      - run: make test

  bench:
    # A separate job so the benchmark neither slows nor is slowed by the test matrix. It runs
    # the medium corpus without spaCy and fails when a value is over its regression budget in
    # bench/targets.py (max(2x the plan's target, a noise margin x the baseline measured on this
    # runner)), or when a baseline is stale and must be lowered. Wall time is the fastest of
    # three runs, to damp the noise of shared runners. The runner image is pinned, because the
    # baselines were measured on it; re-measure them if you change it. The results table goes
    # to the job summary.
    name: benchmark (medium corpus, without spaCy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python bench/run.py --quick --repeat 3 --check
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench/results.json
          if-no-files-found: ignore
