name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (Python ${{ matrix.python-version }}, with spaCy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra syntax
      - run: make test
      # Lint, format and type checks target the oldest supported Python (see pyproject.toml);
      # run them once, on that version.
      - if: matrix.python-version == '3.11'
        run: make lint typecheck
      - if: matrix.python-version == '3.11'
        run: make demo

  no-syntax:
    name: test (Python 3.11, without spaCy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # uv installs the spacy-model group by default (it's inert without spaCy); leave it
      # out, here and in every `uv run`, so nothing of spaCy's is installed.
      UV_NO_GROUP: spacy-model
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - name: Confirm spaCy is absent
        run: uv run python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('spacy') is not None)"
      - run: make test

  platforms:
    name: test (Python 3.11, ${{ matrix.os }}, syntax=${{ matrix.syntax }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # Pre-existing Windows full-suite failures are listed in this PR; WP-3 and WP-5 regressions
    # remain required in windows-platforms below.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            syntax: false
            no-group: spacy-model
          - os: windows-latest
            syntax: false
            no-group: spacy-model
          - os: macos-latest
            syntax: true
            no-group: ""
    env:
      UV_NO_GROUP: ${{ matrix.no-group }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          python-version: "3.11"
      - if: matrix.syntax
        run: uv sync --locked --extra syntax
      - if: '!matrix.syntax'
        run: uv sync --locked
      - if: '!matrix.syntax'
        name: Confirm spaCy is absent
        run: uv run python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('spacy') is not None)"
      - run: make test

  windows-platforms:
    name: Windows platform regressions (Python 3.11)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      UV_NO_GROUP: spacy-model
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - name: Confirm spaCy is absent
        run: uv run python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('spacy') is not None)"
      - run: uv run pytest -n auto tests/test_platforms.py tests/test_report_compatibility.py tests/test_cli_onboarding.py tests/test_input_robustness.py tests/test_demo.py tests/test_library_start.py tests/test_build_speed.py tests/test_concise_output.py tests/test_cache.py::test_a_relative_xdg_cache_home_is_ignored tests/test_throughput.py::test_memory_jobs_follow_physical_memory
      - run: uv run pytest 'tests/test_snapshots.py::test_snapshot[surface-demo]' tests/test_snapshots.py::test_demo_snapshot_is_independent_of_disk_cache

  package:
    # What a user gets from PyPI: build the sdist and the wheel (the wheel from the sdist),
    # check what each contains, then install the wheel with pip into a new Python 3.11
    # environment and, from outside the repository, run build, score and the README's library
    # example on examples/. It then installs the syntax extra, checks the note suggests
    # `styleprofile setup`, runs setup (downloading spaCy's model) and builds with the parser.
    # Finally it unpacks the sdist and runs its own test suite, as a downstream packager
    # would. See scripts/check_dist.py; the same `make dist-check` runs it locally.
    name: package (build, install the wheel on Python 3.11, smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_NO_GROUP: spacy-model
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
      - run: uv sync --locked
      - run: make dist-check DIST="--syntax --sdist-tests"

  bench:
    # A separate job so the benchmark neither slows nor is slowed by the test matrix. It runs
    # the medium corpus without spaCy for this change *and for its base*, HEAD^ (for a pull
    # request, HEAD is GitHub's merge commit and HEAD^ the tip of main it merges into; for a
    # push to main, the commit before). The two alternate on the same runner, five runs each,
    # and the job fails when the change is worse than its base by more than the margins in
    # bench/targets.py (CPU time 1.15x, peak memory 1.1x, profile size 1.05x), unless
    # bench/accepted.toml accepts the cost for this PR. Wall time on shared runners swings by
    # up to ~75% between runs, so absolute budgets were flaky; the plan's targets are now only
    # a report. The tables go to the job summary.
    name: benchmark (medium corpus, without spaCy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 2  # HEAD^, the base
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python bench/run.py --quick --repeat 5 --against HEAD^ --check
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: bench-results
          path: bench/results.json
          if-no-files-found: ignore
