name: Release

# Publishes to PyPI with trusted publishing (OIDC): no API token is stored anywhere.
#
# - Pushing a tag v<version> (e.g. v0.2.0) builds, checks and publishes that version to PyPI.
#   The tag must match `version` in pyproject.toml.
# - Running the workflow by hand (Actions > Release > Run workflow) is a dry run: it builds
#   <version>.dev<run number> and publishes it to TestPyPI, so it can be repeated.
#
# Actions are pinned by commit SHA, since the publish jobs can mint a PyPI token; Dependabot
# (.github/dependabot.yml) proposes updates. The release jobs don't cache (a poisoned cache
# can't reach a release) or keep the checkout's credentials.
#
# It never runs on ordinary pushes or pull requests. The one-time setup on PyPI and TestPyPI
# (a trusted publisher for this workflow and each environment) is in docs/releasing.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UV_NO_GROUP: spacy-model
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: false
      - name: Check the tag matches the package version
        if: github.event_name == 'push'
        run: |
          version="$(uv version --short)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version ${version} in pyproject.toml"
            exit 1
          fi
      - run: uv sync --locked
      - run: make test
      # After the tests, which check the version against the CHANGELOG; uv re-locks after it.
      - name: Mark a dry run as a development version
        if: github.event_name == 'workflow_dispatch'
        run: uv version --frozen "$(uv version --short).dev${GITHUB_RUN_NUMBER}"
      # Build once; check and smoke-test those exact files (contents, metadata, twine
      # check, the wheel on Python 3.11), which are the ones uploaded below.
      - run: uv build --out-dir dist
      - run: make dist-check DIST="--dist dist --syntax"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    name: publish to TestPyPI (dry run)
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/styleprofile
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      # v1.14.2 or later: hatchling writes Metadata-Version 2.5, which earlier versions of
      # this action (before twine 7) refuse as invalid.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/styleprofile
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      # v1.14.2 or later: hatchling writes Metadata-Version 2.5, which earlier versions of
      # this action (before twine 7) refuse as invalid.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
