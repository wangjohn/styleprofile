[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "styleprofile"
version = "0.1.0"
description = "Stylometric profiles of a writer's texts: drift from a reference and LLM-likeness."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
syntax = [
  "spacy>=3.8,<4",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[dependency-groups]
dev = [
  "pyright>=1.1.400,<2",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[project.scripts]
styleprofile = "styleprofile.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/styleprofile"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests", "bench"]
# The benchmark's ignored checkouts of a base revision (bench/run.py --against) and its
# generated corpora; the rest are pyright's defaults, which an exclude list replaces. Ruff
# skips them already, as it skips every ignored path.
exclude = ["bench/work", "bench/corpora", "**/node_modules", "**/__pycache__", "**/.*"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

# Tests read reports they just made, so an optional key (``contrast``) or a None they know is
# not there is a test failure at worst; the source is checked in full.
[[tool.pyright.executionEnvironments]]
root = "tests"
reportTypedDictNotRequiredAccess = false
reportOptionalSubscript = false
reportOptionalOperand = false
reportOptionalIterable = false
